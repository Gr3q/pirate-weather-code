x-dns-defaults: &dns_defaults
  dns:
    - 1.1.1.1
    - 8.8.8.8
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

# UK-subset self-host: GFS + GEFS + ECMWF. Storage roots via .env (PW_WEATHER_ROOT, PW_WORK_ROOT).
# Reader expects flat <PW_WEATHER_ROOT>/<MODEL>.zarr; link Prod/<MODEL>/<INGEST_VERSION_STR>/<MODEL>.zarr
# (INGEST_VERSION_STR in API/constants/shared_const.py). See docs/SELF_HOSTING.md before first run.

x-volumes: &volumes
  volumes:
    - ${PW_WEATHER_ROOT:?Set PW_WEATHER_ROOT in .env}:/data
    - ${PW_WORK_ROOT:?Set PW_WORK_ROOT in .env}:/tmp

services:
  # Ofelia for scheduling tasks
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      ofelia.job-run.wmo-alerts-ingest.schedule: "0 0,30 * * * *"
      ofelia.job-run.wmo-alerts-ingest.container: "pirate-ingest-wmo-alerts"
      ofelia.job-run.wmo-alerts-ingest.no-overlap: "true"
      ofelia.job-run.gfs-ingest.schedule: "0 10 5,11,17,23 * * *"
      ofelia.job-run.gfs-ingest.container: "pirate-ingest-gfs"
      ofelia.job-run.gfs-ingest.no-overlap: "true"
      ofelia.job-run.gefs-ingest.schedule: "0 0 1,7,13,19 * * *"
      ofelia.job-run.gefs-ingest.container: "pirate-ingest-gefs"
      ofelia.job-run.gefs-ingest.no-overlap: "true"
      ofelia.job-run.ecmwf-ingest.schedule: "0 0 8,20 * * *"
      ofelia.job-run.ecmwf-ingest.container: "pirate-ingest-ecmwf"
      ofelia.job-run.ecmwf-ingest.no-overlap: "true"
    depends_on:
      wmo_alerts_ingest:
        condition: service_completed_successfully
      gfs_ingest:
        condition: service_completed_successfully
      gefs_ingest:
        condition: service_completed_successfully
      ecmwf_ingest:
        condition: service_completed_successfully

  # WMO Alerts Ingest (alerts store is required, see docs/SELF_HOSTING.md)
  wmo_alerts_ingest:
    <<: [*dns_defaults, *volumes]
    container_name: pirate-ingest-wmo-alerts
    image: pirateingest:latest
    environment:
      wgrib2_path: "/build/wgrib2_build/bin/wgrib2 "
      forecast_process_dir: "/tmp/Process/WMO_Alerts"
      forecast_path: "/data/Prod/WMO_Alerts"
      historic_path: "/data/Hist/WMO_Alerts"
      save_type: "Download"
      zarr_store_workers: "1"
      zarr_async_concurrency: "1"
    command: ["API/WMO_Alerts_Local.py"]

  # GFS Ingest
  gfs_ingest:
    <<: [*dns_defaults, *volumes]
    container_name: pirate-ingest-gfs
    image: pirateingest:latest
    build:
      context: .
      dockerfile: Docker/pirate-ingest-dockerfile
    environment:
      wgrib2_path: "/build/wgrib2_build/bin/wgrib2 "
      forecast_process_dir: "/tmp/Process/GFS"
      forecast_path: "/data/Prod/GFS"
      historic_path: "/data/Hist/GFS"
      save_type: "Download"
      zarr_store_workers: "1"
      zarr_async_concurrency: "1"
    command: ["API/GFS_Local_Ingest.py"]

  # GEFS Ingest
  gefs_ingest:
    <<: [*dns_defaults, *volumes]
    container_name: pirate-ingest-gefs
    image: pirateingest:latest
    environment:
      wgrib2_path: "/build/wgrib2_build/bin/wgrib2 "
      forecast_process_dir: "/tmp/Process/GEFS"
      forecast_path: "/data/Prod/GEFS"
      historic_path: "/data/Hist/GEFS"
      save_type: "Download"
      zarr_store_workers: "1"
      zarr_async_concurrency: "1"
    command: ["API/GEFS_Local_Ingest.py"]
    depends_on:
      gfs_ingest:
        condition: service_completed_successfully

  # ECMWF Ingest
  ecmwf_ingest:
    <<: [*dns_defaults, *volumes]
    container_name: pirate-ingest-ecmwf
    image: pirateingest:latest
    environment:
      wgrib2_path: "/build/wgrib2_build/bin/wgrib2 "
      forecast_process_dir: "/tmp/Process/ECMWF"
      forecast_path: "/data/Prod/ECMWF"
      historic_path: "/data/Hist/ECMWF"
      save_type: "Download"
      zarr_store_workers: "1"
      zarr_async_concurrency: "1"
    command: ["API/ECMWF_Local_Ingest.py"]
    depends_on:
      gfs_ingest:
        condition: service_completed_successfully
      gefs_ingest:
        condition: service_completed_successfully

  # API server: repo mounted over /app to run the checked-out code.
  api_server:
    image: pirate-zarr-api:latest
    build:
      context: .
      dockerfile: Docker/pirate-api-dockerfile
    container_name: pirate-api
    ports:
      - "8083:8083"
    volumes:
      - .:/app
      - ${PW_WEATHER_ROOT:?Set PW_WEATHER_ROOT in .env}:/data:ro
    environment:
      STAGE: "PROD"
      save_type: "Download"
      save_dir: "/data"
      use_etopo: "FALSE"
      TIMING: "TRUE"
    command: ["API.responseLocal:app", "--host", "0.0.0.0", "--port", "8083"]
    restart: unless-stopped
